# ── Шлюз TMVOS: общие настройки ──────────────────────────────────────────────
# Маршруты конкретных приложений лежат по одному файлу в nginx/apps/*.conf.
# Добавить/убрать панель = добавить/удалить файл и выполнить ./reload-nginx.sh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # DNS Docker. Имена контейнеров резолвятся при каждом запросе (proxy_pass с
    # переменной), поэтому nginx стартует и работает, даже если какое-то
    # приложение сейчас остановлено или ещё не создано.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # Редиректы вида /press -> /press/ отдаются относительными, чтобы не
    # подставлялся внутренний порт контейнера.
    absolute_redirect off;

    # Импорт файлов в климатике и т.п.
    client_max_body_size 100m;

    # Общие настройки проксирования для всех приложений: WebSocket, SSE
    # (канал управления дашбордов), долгие соединения.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering    off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 3s;

    # Приложение не запущено / не отвечает -> понятная заглушка вместо 502.
    error_page 502 503 504 /_down.html;
    location = /_down.html {
        internal;
        root /usr/share/nginx/portal;
        add_header Cache-Control "no-store" always;
    }

    # ── Приложения ───────────────────────────────────────────────────────────
    include /etc/nginx/apps/*.conf;

    # ── Стартовая страница ───────────────────────────────────────────────────
    location /portal-api/ {
        set $portal portal:8080;
        proxy_pass http://$portal;
    }

    location / {
        root /usr/share/nginx/portal;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
