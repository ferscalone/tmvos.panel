# Стенд на изгиб (dashboard2) -> http://tmvos.panel/bend/
# Контейнер: dashboard2 (compose-проект server/dashboard2), порт внутри: 80.

location = /bend { return 301 /bend/; }

location /bend/ {
    set $bend_upstream dashboard2:80;
    rewrite ^/bend/(.*)$ /$1 break;
    proxy_pass http://$bend_upstream;
}
