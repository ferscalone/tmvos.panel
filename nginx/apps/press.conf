# Стенд на пресс (dashboard1) -> http://tmvos.panel/press/
# Контейнер: dashboard1 (compose-проект server/dashboard1), порт внутри: 80.

location = /press { return 301 /press/; }

location /press/ {
    set $press_upstream dashboard1:80;
    rewrite ^/press/(.*)$ /$1 break;
    proxy_pass http://$press_upstream;
}
