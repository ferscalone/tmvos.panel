# Климатика (climatica-web) -> http://tmvos.panel/climatica/
# Контейнер: backend проекта climatica-web, в сети tmvos у него алиас "climatica".

location = /climatica { return 301 /climatica/; }

location /climatica/ {
    set $climatica_upstream climatica:8000;
    rewrite ^/climatica/(.*)$ /$1 break;
    proxy_pass http://$climatica_upstream;
}
